<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E35C4"/>
      <stop offset="1" stop-color="#0A2899"/>
    </linearGradient>
  </defs>
  <rect width="440" height="280" fill="url(#bg)"/>
  <!-- subtle decorative blue square -->
  <rect x="-40" y="-40" width="180" height="180" fill="#1d4ed8" opacity="0.18" transform="rotate(18 50 50)"/>

  <!-- title -->
  <text x="32" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#ffffff">ZHL Productivity</text>
  <text x="32" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#ffffff">Pack</text>

  <!-- subtitle -->

  <!-- feature chips -->
  <g font-family="Calibri, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">
    <rect x="32" y="190" width="100" height="26" rx="13" fill="#1d4ed8"/><text x="82" y="207" text-anchor="middle">📧  Appraisal Blast</text>
    <rect x="140" y="190" width="100" height="26" rx="13" fill="#1d4ed8"/><text x="190" y="207" text-anchor="middle">📅  Reminders</text>
    <rect x="248" y="190" width="80" height="26" rx="13" fill="#1d4ed8"/><text x="288" y="207" text-anchor="middle">🧮  Calcs</text>
    <rect x="32" y="222" width="100" height="26" rx="13" fill="#1d4ed8"/><text x="82" y="239" text-anchor="middle">📄  Borrower PDF</text>
    <rect x="140" y="222" width="90" height="26" rx="13" fill="#1d4ed8"/><text x="185" y="239" text-anchor="middle">📞  Caller ID</text>
    <rect x="238" y="222" width="90" height="26" rx="13" fill="#1d4ed8"/><text x="283" y="239" text-anchor="middle">🪄  VPA Email</text>

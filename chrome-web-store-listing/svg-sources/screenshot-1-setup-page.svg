<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <!-- Chrome top bar mock -->
  <rect width="1280" height="800" fill="#e5e7eb"/>
  <rect x="0" y="0" width="1280" height="80" fill="#202124"/>
  <circle cx="20" cy="22" r="6" fill="#f87171"/><circle cx="40" cy="22" r="6" fill="#fbbf24"/><circle cx="60" cy="22" r="6" fill="#34d399"/>
  <rect x="90" y="14" width="200" height="20" rx="4" fill="#3c4043"/>
  <text x="100" y="29" font-family="Arial,sans-serif" font-size="12" fill="#9aa0a6">ZHL Productivity Pack</text>
  <rect x="20" y="46" width="1240" height="34" rx="6" fill="#3c4043"/>
  <text x="34" y="68" font-family="Arial,sans-serif" font-size="12" fill="#9aa0a6">chrome-extension://…/setup.html</text>

  <!-- Page bg -->
  <rect x="0" y="80" width="1280" height="720" fill="#ffffff"/>

  <!-- Hero / header -->
  <rect x="0" y="80" width="1280" height="160" fill="#0E35C4"/>
  <text x="60" y="148" font-family="Georgia,'Times New Roman',serif" font-size="42" font-weight="700" fill="#ffffff">ZHL Productivity Pack</text>
  <text x="60" y="188" font-family="Calibri,Arial,sans-serif" font-size="18" fill="#cfd9ff">Setup · v1.64.27 · 30+ workflow modules. Toggle any module on or off below.</text>
  <text x="60" y="216" font-family="Calibri,Arial,sans-serif" font-size="13" fill="#cfd9ff">Stored locally on this Chrome profile only — nothing syncs to the cloud.</text>

  <!-- LO Profile card -->
  <rect x="60"  y="270" width="560" height="200" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="80" y="300" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Loan Officer Profile</text>
  <text x="80" y="320" font-family="Arial,sans-serif" font-size="12" fill="#6b7280">Stamped onto borrower-facing PDFs and pulled into VPA / Intro emails.</text>
  <!-- fields -->
  <g font-family="Arial,sans-serif" font-size="12">
    <text x="80"  y="350" font-weight="700" fill="#374151">Name</text>
    <rect x="80" y="358" width="240" height="28" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="92" y="377" fill="#111827">Justin Case</text>

    <text x="340" y="350" font-weight="700" fill="#374151">NMLS ID</text>
    <rect x="340" y="358" width="240" height="28" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="352" y="377" fill="#111827">2182068</text>

    <text x="80"  y="402" font-weight="700" fill="#374151">Phone</text>
    <rect x="80" y="410" width="240" height="28" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="92" y="429" fill="#111827">+1 913-845-9564</text>

    <text x="340" y="402" font-weight="700" fill="#374151">Email</text>
    <rect x="340" y="410" width="240" height="28" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="352" y="429" fill="#111827">justinca@zillowhomeloans.com</text>
  </g>

  <!-- Feature module cards -->
  <g font-family="Arial,sans-serif">
    <!-- Card 1: Meeting Reminders -->
    <rect x="660" y="270" width="560" height="92" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="680" y="300" font-size="16" font-weight="700" fill="#0f172a">Meeting Reminders</text>
    <text x="680" y="320" font-size="12" fill="#6b7280">Outlook-style reminder pop-ups in Gmail, sourced from Google Calendar.</text>
    <text x="680" y="342" font-size="11" fill="#374151">Runs on  mail.google.com  ·  configurable lead times</text>
    <!-- toggle -->
    <rect x="1158" y="304" width="44" height="22" rx="11" fill="#0E35C4"/>
    <circle cx="1192" cy="315" r="9" fill="#ffffff"/>
    <text x="1153" y="343" font-size="11" font-weight="600" fill="#0E35C4" text-anchor="end">Enabled</text>

    <!-- Card 2: Appraisal Blast -->
    <rect x="660" y="378" width="560" height="92" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="680" y="408" font-size="16" font-weight="700" fill="#0f172a">Appraisal Blast</text>
    <text x="680" y="428" font-size="12" fill="#6b7280">One-click forwards Reggora appraisal results to all parties with a branded HTML body.</text>
    <text x="680" y="450" font-size="11" fill="#374151">Runs on  mail.google.com + *.lightning.force.com</text>
    <rect x="1158" y="412" width="44" height="22" rx="11" fill="#0E35C4"/>
    <circle cx="1192" cy="423" r="9" fill="#ffffff"/>
    <text x="1153" y="451" font-size="11" font-weight="600" fill="#0E35C4" text-anchor="end">Enabled</text>

    <!-- Card 3: VPA Email -->
    <rect x="60"  y="486" width="560" height="92" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="80" y="516" font-size="16" font-weight="700" fill="#0f172a">VPA Email</text>
    <text x="80" y="536" font-size="12" fill="#6b7280">Send a fully-branded pre-approval email from a Salesforce Lead in one click.</text>
    <text x="80" y="558" font-size="11" font-weight="600" fill="#0E35C4">Customizable template · pulls LO Profile data automatically</text>
    <rect x="558" y="520" width="44" height="22" rx="11" fill="#0E35C4"/>
    <circle cx="592" cy="531" r="9" fill="#ffffff"/>
    <text x="553" y="559" font-size="11" font-weight="600" fill="#0E35C4" text-anchor="end">Enabled</text>

    <!-- Card 4: Loan Comparison PDF -->
    <rect x="660" y="486" width="560" height="92" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="680" y="516" font-size="16" font-weight="700" fill="#0f172a">Loan Comparison PDF</text>
    <text x="680" y="536" font-size="12" fill="#6b7280">Borrower-facing handout: per-scenario PITIA, itemized closing costs, equity callout.</text>
    <text x="680" y="558" font-size="11" font-weight="600" fill="#0E35C4">Includes 2% Grant variant when applicable</text>
    <rect x="1158" y="520" width="44" height="22" rx="11" fill="#0E35C4"/>
    <circle cx="1192" cy="531" r="9" fill="#ffffff"/>
    <text x="1153" y="559" font-size="11" font-weight="600" fill="#0E35C4" text-anchor="end">Enabled</text>

    <!-- Card 5: Pricing Exception Workflow -->
    <rect x="60"  y="594" width="560" height="92" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="80" y="624" font-size="16" font-weight="700" fill="#0f172a">Pricing Exception Workflow</text>
    <text x="80" y="644" font-size="12" fill="#6b7280">Branched modal walks the LO through PE submission and generates the ready-to-send email.</text>
    <text x="80" y="666" font-size="11" font-weight="600" fill="#0E35C4">Auto-computes PE $ and points</text>
    <rect x="558" y="628" width="44" height="22" rx="11" fill="#0E35C4"/>
    <circle cx="592" cy="639" r="9" fill="#ffffff"/>
    <text x="553" y="667" font-size="11" font-weight="600" fill="#0E35C4" text-anchor="end">Enabled</text>

    <!-- Card 6: more modules -->
    <rect x="660" y="594" width="560" height="92" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="680" y="624" font-size="16" font-weight="700" fill="#0f172a">… and 28 more modules</text>
    <text x="680" y="646" font-size="12" fill="#6b7280">VA Calc · 2-1 Buydown · Caller ID · Net Proceeds · Drag Gmail attachments · DTI Max pill ·</text>
    <text x="680" y="664" font-size="12" fill="#6b7280">SF Intro Email · Zoho Booking · Loan Story · FHA badges · Address Copy · LOP File Copy …</text>
  </g>

  <!-- bottom strip -->
  <rect x="0" y="760" width="1280" height="40" fill="#f3f4f6"/>
  <text x="60" y="785" font-family="Calibri,Arial,sans-serif" font-size="12" fill="#6b7280">v1.64.27  ·  Built by Justin Case  ·  Karma appreciated 💛  ·  Stored locally — nothing leaves your browser.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <!-- Gmail-ish chrome backdrop -->
  <rect width="1280" height="800" fill="#f6f8fc"/>
  <rect x="0" y="0" width="1280" height="60" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="38" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ea4335">M</text>
  <text x="58" y="38" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5f6368">Gmail</text>
  <rect x="200" y="14" width="600" height="32" rx="6" fill="#eaf1fb"/>
  <text x="220" y="34" font-family="Arial,sans-serif" font-size="13" fill="#5f6368">🔍  Search mail</text>

  <!-- Sidebar -->
  <rect x="0" y="60" width="200" height="740" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="20" y="76" width="160" height="40" rx="20" fill="#c2e7ff"/>
  <text x="44" y="100" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#001d35">✎  Compose</text>
  <g font-family="Arial,sans-serif" font-size="13" fill="#202124">
    <text x="32" y="138">Inbox</text>
    <text x="32" y="166">Starred</text>
    <text x="32" y="194">Sent</text>
    <text x="32" y="222">Drafts</text>
  </g>

  <!-- compose window (popup style overlaid) -->
  <rect x="240" y="100" width="980" height="660" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="240" y="100" width="980" height="44" rx="10" fill="#404040"/>
  <rect x="240" y="124" width="980" height="20" fill="#404040"/>
  <text x="262" y="130" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#ffffff">New Message</text>
  <text x="1200" y="130" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="end">— ×</text>

  <!-- Recipients + subject -->
  <g font-family="Arial,sans-serif" font-size="12">
    <text x="262" y="170" fill="#5f6368">To</text>
    <text x="290" y="170" fill="#202124">john.borrower@gmail.com,  jane.coborrower@gmail.com,  alice@kw.com (Buyer's Agent),  taylor@title.com (Transaction Coordinator)</text>
    <line x1="262" y1="180" x2="1200" y2="180" stroke="#e5e7eb"/>
    <text x="262" y="200" fill="#5f6368">Cc</text>
    <text x="290" y="200" fill="#202124">processor@zillowhomeloans.com</text>
    <line x1="262" y1="210" x2="1200" y2="210" stroke="#e5e7eb"/>
    <text x="262" y="230" fill="#202124" font-weight="600">Appraisal Received - Smith - 136 Mason Ridge Cir, Columbia SC 29229</text>
    <line x1="262" y1="240" x2="1200" y2="240" stroke="#e5e7eb"/>
  </g>

  <!-- Branded HTML body -->
  <g transform="translate(282,266)">
    <!-- ZHL logo text -->
    <text x="0" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#0E35C4">Zillow Home Loans</text>
    <!-- headline -->
    <text x="0" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#0E35C4">🎉 Congratulations!</text>
    <text x="0" y="124" font-family="Calibri,Arial,sans-serif" font-size="15" fill="#000000">Great news — the appraisal on <tspan font-weight="700">136 Mason Ridge Cir, Columbia SC 29229</tspan> just came back.</text>

    <!-- Highlight box -->
    <rect x="0" y="148" width="900" height="200" fill="#F5F9FF"/>
    <rect x="0" y="148" width="4" height="200" fill="#0E35C4"/>

    <text x="24" y="176" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="1">APPRAISED VALUE</text>
    <text x="24" y="208" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="700" fill="#0E35C4">$298,000</text>

    <text x="24" y="240" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="1">PURCHASE PRICE</text>
    <text x="24" y="266" font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">$295,000</text>

    <text x="24" y="298" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="1">IMMEDIATE EQUITY</text>
    <text x="24" y="324" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="700" fill="#16a34a">$3,000  🎉</text>

    <!-- Condition + closing -->
    <text x="0" y="380" font-family="Calibri,Arial,sans-serif" font-size="15" fill="#000000">The home came back <tspan font-weight="700">as-is, so no repairs are required</tspan>.</text>
    <text x="0" y="416" font-family="Calibri,Arial,sans-serif" font-size="15" fill="#000000">Reach out with any questions!</text>
  </g>

  <!-- Attachment chip -->
  <rect x="282" y="710" width="320" height="38" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="298" y="734" font-family="Arial,sans-serif" font-size="13" fill="#0E35C4">📎  ZG001260252484-Hanny.pdf  (2.2 MB)</text>

  <!-- Send button -->
  <rect x="262" y="724" width="86" height="34" rx="17" fill="#0b8043"/>
  <text x="305" y="746" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Send  ▾</text>

  <!-- ZHL Appraisal Blast floating panel -->
  <g transform="translate(950,640)">
    <rect x="0" y="0" width="240" height="120" rx="10" fill="#1F3864"/>
    <text x="14" y="28" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Appraisal Blast</text>
    <text x="225" y="28" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="end" opacity="0.6">×</text>
    <rect x="14" y="42" width="212" height="34" rx="6" fill="#BF8F00"/>
    <text x="120" y="63" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">📧  Send to all parties</text>
    <text x="14" y="98" font-family="Arial,sans-serif" font-size="11" fill="#D6E4F0">Draft opened. Review and send.</text>
  </g>
</svg>

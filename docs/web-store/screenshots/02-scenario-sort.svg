      <text x="52" y="343" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Update pricing</text>
      <rect x="98" y="320" width="80" height="34" rx="4" fill="#ffffff" stroke="#006aff"/>
      <text x="138" y="343" text-anchor="middle" font-size="12" font-weight="600" fill="#006aff">Assign</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(420, 0)">
      <rect width="190" height="380" rx="6" fill="#ffffff" stroke="#d9dee5"/>
      <text x="95" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Conf 30 Yr Fixed</text>
      <text x="95" y="55" text-anchor="middle" font-size="11" fill="#6b7280">Purchase - $484,030.00</text>
      <line x1="12" y1="75" x2="178" y2="75" stroke="#e5e7eb"/>
      <g font-size="11">
        <text x="12" y="97" fill="#374151">Interest rate</text>
        <text x="178" y="97" text-anchor="end" font-weight="700" fill="#374151">6.125%</text>
        <text x="12" y="117" fill="#374151">APR</text>
        <text x="178" y="117" text-anchor="end" fill="#1f2937">6.529%</text>
        <text x="12" y="137" fill="#374151">Monthly P&amp;I/PITI</text>
        <text x="178" y="137" text-anchor="end" fill="#1f2937">$2,737</text>

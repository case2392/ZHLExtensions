  <!-- Calc 2-1 Buydown buttons under each card -->
  <g transform="translate(40, 555)" font-size="11" font-weight="600" fill="#ffffff">
    <rect x="0" y="0" width="160" height="28" rx="4" fill="#006aff"/>
    <text x="80" y="18" text-anchor="middle">Calc 2-1 Buydown</text>
    <rect x="210" y="0" width="160" height="28" rx="4" fill="#006aff"/>
    <text x="290" y="18" text-anchor="middle">Calc 2-1 Buydown</text>
    <rect x="420" y="0" width="160" height="28" rx="4" fill="#006aff"/>
    <text x="500" y="18" text-anchor="middle">Calc 2-1 Buydown</text>
    <rect x="630" y="0" width="160" height="28" rx="4" fill="#006aff"/>
    <text x="710" y="18" text-anchor="middle">Calc 2-1 Buydown</text>
    <rect x="840" y="0" width="160" height="28" rx="4" fill="#006aff"/>
    <text x="920" y="18" text-anchor="middle">Calc 2-1 Buydown</text>
    <rect x="1050" y="0" width="140" height="28" rx="4" fill="#006aff"/>
    <text x="1120" y="18" text-anchor="middle">Calc 2-1 Buydown</text>
  </g>

  <!-- Caption strip -->
  <g transform="translate(40, 700)">
    <rect width="1200" height="60" rx="8" fill="#1f2937"/>
    <text x="24" y="28" font-size="14" font-weight="700" fill="#fff">Sort scenarios by rate, drag to reorder, calc 2-1 buydown — all in one toolbar above the cards.</text>
    <text x="24" y="48" font-size="12" fill="#cbd5e1">Generated PDF respects the on-screen order. Resets back to original anytime.</text>
  </g>

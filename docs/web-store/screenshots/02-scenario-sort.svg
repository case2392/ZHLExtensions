        <text x="178" y="97" text-anchor="end" font-weight="700" fill="#92400e">6.490%</text>
      </g>
      <rect x="12" y="320" width="80" height="34" rx="4" fill="#006aff"/>
      <text x="52" y="343" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Update pricing</text>
      <rect x="98" y="320" width="80" height="34" rx="4" fill="#ffffff" stroke="#006aff"/>
      <text x="138" y="343" text-anchor="middle" font-size="12" font-weight="600" fill="#006aff">Assign</text>
    </g>

    <!-- Card 6 -->
    <g transform="translate(1050, 0)">
      <rect width="170" height="380" rx="6" fill="#ffffff" stroke="#d9dee5"/>
      <text x="85" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Conf 30 Yr</text>
      <text x="85" y="55" text-anchor="middle" font-size="11" fill="#6b7280">Purchase - $484,030</text>
      <g font-size="11">
        <text x="12" y="97" fill="#374151">Interest rate</text>
        <text x="158" y="97" text-anchor="end" font-weight="700" fill="#92400e">6.750%</text>

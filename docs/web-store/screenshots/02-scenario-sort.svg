<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="1280" height="800" fill="#f4f6f9"/>

  <!-- Title -->
  <text x="40" y="48" font-size="22" font-weight="700" fill="#1f2937">Scenarios</text>
  <text x="160" y="48" font-size="13" fill="#6b7280">Select scenarios below to generate a comparison or to delete.</text>

  <!-- Sort toolbar (the extension's UI) -->
  <g transform="translate(40, 78)">
    <rect width="640" height="56" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="20" y="35" font-size="14" font-weight="700" fill="#374151">Sort:</text>
    <rect x="68" y="14" width="92" height="28" rx="5" fill="#006aff"/>
    <text x="114" y="33" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Rate ↑</text>
    <rect x="170" y="14" width="92" height="28" rx="5" fill="#006aff"/>
    <text x="216" y="33" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Rate ↓</text>
    <rect x="272" y="14" width="80" height="28" rx="5" fill="#006aff"/>
    <text x="312" y="33" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Reset</text>
    <line x1="362" y1="20" x2="362" y2="36" stroke="#d1d5db"/>
    <rect x="372" y="14" width="100" height="28" rx="5" fill="#006aff"/>
    <text x="422" y="33" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Select all</text>
    <text x="490" y="33" font-size="13" font-weight="700" fill="#10b981">Sorted by rate (low → high)</text>
  </g>

  <!-- Cards row -->
  <g transform="translate(40, 160)">

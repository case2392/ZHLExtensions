        <text x="12" y="97" fill="#374151">Interest rate</text>
        <text x="178" y="97" text-anchor="end" font-weight="700" fill="#0a7d2c">5.990%</text>
        <text x="12" y="117" fill="#374151">APR</text>
        <text x="178" y="117" text-anchor="end" fill="#1f2937">6.450%</text>
        <text x="12" y="137" fill="#374151">Monthly P&amp;I/PITI</text>
        <text x="178" y="137" text-anchor="end" fill="#1f2937">$2,698</text>

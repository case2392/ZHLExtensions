    <text x="95" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">✓ ASSIGNED TO LOAN</text>
    <text x="95" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Conf 30 Yr Fixed</text>
    <text x="95" y="78" text-anchor="middle" font-size="11" fill="#6b7280">Purchase - $484,030.00</text>
    <line x1="12" y1="98" x2="178" y2="98" stroke="#e5e7eb"/>
    <g font-size="11">
      <text x="12" y="120" fill="#374151">Interest rate</text>
      <text x="178" y="120" text-anchor="end" font-weight="700" fill="#0a7d2c">5.875%</text>
      <text x="12" y="140" fill="#374151">APR</text>
      <text x="178" y="140" text-anchor="end" fill="#1f2937">6.379%</text>
      <text x="12" y="160" fill="#374151">Monthly P&amp;I/PITI</text>
      <text x="178" y="160" text-anchor="end" fill="#1f2937">$2,665</text>
      <text x="12" y="180" fill="#374151">Total closing</text>
      <text x="178" y="180" text-anchor="end" fill="#1f2937">$20,851</text>
      <text x="12" y="200" fill="#374151">DTI</text>
      <text x="178" y="200" text-anchor="end" fill="#1f2937">25.71%</text>
      <text x="12" y="220" fill="#374151">Lock period</text>
      <text x="178" y="220" text-anchor="end" font-weight="600" fill="#1f2937">45 days</text>
    </g>
    <rect x="12" y="320" width="166" height="34" rx="4" fill="#006aff"/>
    <text x="95" y="343" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Update pricing</text>

    <!-- Card 2 -->
    <g transform="translate(210, 0)">

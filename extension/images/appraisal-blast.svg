<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Arial, sans-serif">
  <rect width="360" height="220" fill="#f4f6f9"/>

  <!-- Gmail email viewer -->
  <rect x="16" y="16" width="328" height="188" rx="8" fill="#ffffff" stroke="#d9dee5"/>
  <text x="28" y="38" font-size="11" font-weight="700" fill="#1f2937">Appraisal Submission Summary #ZG1234567 - Smith…</text>
  <rect x="28" y="48" width="300" height="1" fill="#e5e7eb"/>

  <!-- Email body -->
  <text x="28" y="68" font-size="9" fill="#374151">Appraised value: $560,000</text>
  <text x="28" y="82" font-size="9" fill="#374151">Estimated value: $530,000</text>
  <text x="28" y="96" font-size="9" fill="#374151">Reconciliation / Report Condition: As-is</text>
  <text x="28" y="110" font-size="9" fill="#374151">Low Value: NO</text>

  <!-- Floating panel -->
  <rect x="206" y="126" width="130" height="62" rx="8" fill="#1F3864"/>
  <text x="216" y="143" font-size="10" font-weight="700" fill="#ffffff">Appraisal Blast</text>
  <rect x="216" y="150" width="110" height="22" rx="5" fill="#BF8F00"/>
  <text x="226" y="165" font-size="9" font-weight="700" fill="#ffffff">📧 Send to all parties</text>
  <text x="216" y="183" font-size="7" fill="#D6E4F0">Draft opened. Review &amp; send.</text>
</svg>

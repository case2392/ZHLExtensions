<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Arial, sans-serif">
  <rect width="360" height="220" fill="#f4f6f9"/>

  <!-- Faux scenario card -->
  <rect x="14" y="14" width="150" height="192" rx="8" fill="#ffffff" stroke="#d9dee5"/>
  <rect x="14" y="14" width="150" height="20" rx="8" fill="#fafbfc"/>
  <text x="22" y="28" font-size="9" font-weight="700" fill="#1f2937">Conf 30 Yr Fixed</text>

  <g font-size="9" fill="#374151">
    <text x="22" y="50">Loan amount</text>
    <text x="156" y="50" text-anchor="end" fill="#111827" font-weight="600">$315,250</text>
    <text x="22" y="66">Rate</text>
    <text x="156" y="66" text-anchor="end" fill="#111827" font-weight="600">6.490%</text>
    <text x="22" y="82">P&amp;I</text>
    <text x="156" y="82" text-anchor="end" fill="#111827" font-weight="600">$1,990.52</text>
    <text x="22" y="98">Closing costs</text>
    <text x="156" y="98" text-anchor="end" fill="#111827" font-weight="600">$10,914.63</text>
  </g>

  <!-- Buydown button under the card -->
  <rect x="22" y="174" width="134" height="22" rx="4" fill="#006aff"/>
  <text x="89" y="189" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Calc 2-1 Buydown</text>

  <!-- Arrow to popup -->
  <path d="M167 130 L188 130" stroke="#006aff" stroke-width="2" fill="none"/>
  <polygon points="186,126 192,130 186,134" fill="#006aff"/>

  <!-- Popup panel preview -->
  <rect x="194" y="20" width="152" height="180" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="194" y="20" width="152" height="22" rx="8" fill="#006aff"/>
  <text x="204" y="36" font-size="10" font-weight="700" fill="#ffffff">2-1 Buydown</text>

  <g font-size="8.5">
    <text x="202" y="58" font-weight="700" fill="#374151">YEAR 1 (4.490%)</text>
    <text x="338" y="58" text-anchor="end" fill="#111827" font-weight="700">$1,594.43</text>

    <text x="202" y="78" font-weight="700" fill="#374151">YEAR 2 (5.490%)</text>
    <text x="338" y="78" text-anchor="end" fill="#111827" font-weight="700">$1,786.20</text>

    <text x="202" y="98" font-weight="700" fill="#374151">YEAR 3+ (6.490%)</text>
    <text x="338" y="98" text-anchor="end" fill="#111827" font-weight="700">$1,990.52</text>
  </g>

  <line x1="202" y1="108" x2="338" y2="108" stroke="#e5e7eb"/>

  <g font-size="8.5">
    <text x="202" y="124" fill="#374151">Y1 savings</text>
    <text x="338" y="124" text-anchor="end" fill="#111827">$4,753.08</text>

    <text x="202" y="138" fill="#374151">Y2 savings</text>
    <text x="338" y="138" text-anchor="end" fill="#111827">$2,451.84</text>
  </g>

  <line x1="202" y1="148" x2="338" y2="148" stroke="#e5e7eb"/>

  <text x="202" y="166" font-size="9" font-weight="700" fill="#111827">Buydown cost</text>
  <text x="338" y="166" text-anchor="end" font-size="9" font-weight="700" fill="#047857">$7,204.92</text>

  <text x="202" y="184" font-size="8" fill="#92400e">≈ 2.28% of loan amount</text>
</svg>

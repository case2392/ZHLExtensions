<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Arial, sans-serif">
  <rect width="360" height="220" fill="#f4f6f9"/>

  <!-- Gmail backdrop hint -->
  <rect x="0" y="0" width="360" height="30" fill="#fff" stroke="#e5e7eb"/>
  <text x="14" y="20" font-size="11" font-weight="700" fill="#ea4335">M</text>
  <text x="28" y="20" font-size="11" fill="#6b7280">Gmail</text>

  <!-- Reminder popup card -->
  <rect x="150" y="40" width="196" height="150" rx="10" fill="#ffffff" stroke="#c7ccd1"/>
  <!-- header -->
  <rect x="150" y="40" width="196" height="30" rx="10" fill="#1d4ed8"/>
  <rect x="150" y="55" width="196" height="15" fill="#1d4ed8"/>
  <text x="162" y="60" font-size="12" font-weight="700" fill="#ffffff">🔔 2 Reminders</text>

  <!-- reminder row 1 -->
  <text x="162" y="90" font-size="11" font-weight="700" fill="#0f172a">Team standup</text>
  <text x="162" y="103" font-size="8.5" fill="#6b7280">10:15 AM, Thursday</text>
  <text x="162" y="117" font-size="10" font-weight="700" fill="#b91c1c">in 5 minutes</text>
  <rect x="246" y="84" width="44" height="18" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <text x="268" y="96" font-size="8" fill="#0f172a" text-anchor="middle">Snooze</text>
  <rect x="294" y="84" width="44" height="18" rx="4" fill="#1d4ed8"/>
  <text x="316" y="96" font-size="8" fill="#fff" text-anchor="middle">Dismiss</text>

  <line x1="150" y1="128" x2="346" y2="128" stroke="#eef0f2"/>

  <!-- reminder row 2 -->
  <text x="162" y="146" font-size="11" font-weight="700" fill="#0f172a">Borrower call</text>
  <text x="162" y="159" font-size="8.5" fill="#6b7280">10:40 AM, Thursday</text>
  <text x="162" y="173" font-size="10" font-weight="700" fill="#1d4ed8">in 30 minutes</text>

  <!-- footer -->
  <rect x="150" y="178" width="196" height="12" fill="#f8fafc"/>
  <text x="162" y="187" font-size="7.5" fill="#94a3b8">Snooze for: 5 min · Dismiss all</text>

  <!-- title -->
  <text x="16" y="74" font-size="13" font-weight="700" fill="#1f2937">Meeting</text>
  <text x="16" y="92" font-size="13" font-weight="700" fill="#1f2937">Reminders</text>
  <text x="16" y="116" font-size="9" fill="#6b7280">Outlook-style pop-ups</text>
  <text x="16" y="130" font-size="9" fill="#6b7280">from your Google</text>
  <text x="16" y="144" font-size="9" fill="#6b7280">Calendar, right inside</text>
  <text x="16" y="158" font-size="9" fill="#6b7280">Gmail.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Arial, sans-serif">
  <rect width="360" height="220" fill="#f4f6f9"/>

  <!-- Card -->
  <rect x="14" y="14" width="332" height="192" rx="8" fill="#ffffff" stroke="#d9dee5"/>
  <rect x="14" y="14" width="332" height="22" rx="8" fill="#fafbfc"/>
  <text x="22" y="29" font-size="10" font-weight="700" fill="#1f2937">FHA 90-Day Flip Rule</text>

  <!-- Inputs -->
  <g font-size="9" fill="#374151">
    <text x="24" y="58">Seller's purchase date</text>
    <rect x="180" y="48" width="120" height="14" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="240" y="58" text-anchor="middle" font-weight="600" fill="#111827">02/15/2026</text>

    <text x="24" y="80">Contract date</text>
    <rect x="180" y="70" width="120" height="14" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="240" y="80" text-anchor="middle" font-weight="600" fill="#111827">05/01/2026</text>

    <text x="24" y="102">Days between</text>
    <text x="300" y="102" text-anchor="end" font-weight="700" fill="#b91c1c">75 days</text>
  </g>

  <line x1="14" y1="115" x2="346" y2="115" stroke="#e5e7eb"/>

  <!-- Outcome banner -->
  <rect x="24" y="128" width="312" height="32" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="180" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">⚠ FAILS FHA 90-Day Flip Rule</text>

  <!-- Detail -->
  <g font-size="8" fill="#7f1d1d">
    <text x="32" y="174">Sale-to-resale &lt; 90 days. Loan ineligible for FHA</text>
    <text x="32" y="186">financing unless property is an HUD-exempt category.</text>
  </g>

  <!-- Zillow lookup helper -->
  <rect x="246" y="172" width="86" height="18" rx="3" fill="#0b5cab"/>
  <text x="289" y="184" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Look up on Zillow</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Arial, sans-serif">
  <rect width="360" height="220" fill="#f4f6f9"/>

  <!-- Open email card -->
  <rect x="14" y="14" width="332" height="192" rx="6" fill="#ffffff" stroke="#dddbda"/>

  <!-- Subject row with caller-id badge -->
  <text x="22" y="40" font-size="13" font-weight="700" fill="#1f2937">Do Not Reply: Incoming Text Message from +1 (336) 707-3765</text>
  <!-- Blue Caller ID badge -->
  <rect x="22" y="50" width="92" height="22" rx="11" fill="#0b5cab"/>
  <text x="68" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Aspen Vaughn</text>
  <text x="124" y="65" font-size="10" font-style="italic" fill="#16a34a">← matched from Salesforce</text>

  <line x1="14" y1="82" x2="346" y2="82" stroke="#e5e7eb"/>

  <!-- Sender + meta line -->
  <circle cx="34" cy="100" r="10" fill="#0b5cab"/>
  <text x="34" y="104" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Z</text>
  <text x="52" y="98" font-size="10" font-weight="700" fill="#1f2937">Switchboard Integration</text>
  <text x="52" y="110" font-size="9" fill="#6b7280">to me · 11:16 AM</text>

  <!-- Email body preview -->
  <line x1="14" y1="120" x2="346" y2="120" stroke="#f3f4f6"/>
  <text x="22" y="138" font-size="9" fill="#374151">Please visit your Switchboard inbox to respond to the SMS mentioned</text>
  <text x="22" y="152" font-size="9" fill="#374151">below. Replying to this email will not send a SMS to the client.</text>

  <rect x="22" y="160" width="312" height="40" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="30" y="174" font-size="9" font-weight="700" fill="#374151">SMS Message:</text>
  <text x="30" y="188" font-size="9" fill="#1f2937">Hi, I'm interested in the property at 818 Grand Oaks Dr Eden NC…</text>
</svg>

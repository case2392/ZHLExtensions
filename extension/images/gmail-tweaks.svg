<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Arial, sans-serif">
  <rect width="360" height="220" fill="#f6f8fc"/>
  <!-- Gmail message header bar -->
  <rect x="16" y="20" width="328" height="56" rx="6" fill="#ffffff" stroke="#e1e3e7"/>
  <circle cx="40" cy="48" r="14" fill="#ea4335"/>
  <text x="40" y="53" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">A</text>
  <text x="62" y="42" font-size="12" font-weight="700" fill="#202124">Alex Rivera</text>
  <text x="62" y="58" font-size="11" fill="#5f6368">to me, Sam, Pat — 9:42 AM</text>
  <!-- Toolbar icons on the right -->
  <g transform="translate(232,32)">
    <!-- Reply -->
    <rect width="32" height="32" rx="16" fill="#f1f3f4"/>
    <path d="M10 16l5-5v3h7v4h-7v3z" fill="#5f6368"/>
    <!-- Reply All (highlighted as new) -->
    <g transform="translate(38,0)">
      <rect width="32" height="32" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
      <path d="M6 16l5-5v3h6v4h-6v3z M14 16l5-5v3h7v4h-7v3z" fill="#1a73e8"/>
    </g>
    <!-- More menu -->
    <g transform="translate(76,0)">
      <rect width="32" height="32" rx="16" fill="#f1f3f4"/>
      <circle cx="11" cy="16" r="2" fill="#5f6368"/>
      <circle cx="16" cy="16" r="2" fill="#5f6368"/>
      <circle cx="21" cy="16" r="2" fill="#5f6368"/>
    </g>
  </g>
  <!-- "NEW" badge pointing to reply all -->
  <text x="270" y="84" text-anchor="middle" font-size="10" fill="#1a73e8" font-weight="700">↑ Reply All</text>

  <!-- Email body -->
  <rect x="16" y="92" width="328" height="56" rx="6" fill="#fff" stroke="#e1e3e7"/>
  <text x="28" y="112" font-size="11" fill="#3c4043">Hey team — quick update on the loan file…</text>
  <line x1="28" y1="124" x2="320" y2="124" stroke="#e8eaed"/>
  <line x1="28" y1="134" x2="280" y2="134" stroke="#e8eaed"/>

  <!-- Compose moved to top callout -->
  <rect x="16" y="160" width="328" height="44" rx="6" fill="#fff8e1" stroke="#fbc02d"/>
  <text x="28" y="180" font-size="11" font-weight="700" fill="#5f4300">+ Compose moved to top of thread</text>
  <text x="28" y="195" font-size="10" fill="#7b6322">so the message you're replying to stays visible</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Arial, sans-serif">
  <rect width="360" height="220" fill="#f4f6f9"/>

  <!-- PDF outline -->
  <rect x="36" y="14" width="288" height="192" rx="6" fill="#ffffff" stroke="#d9dee5"/>
  <rect x="36" y="14" width="288" height="22" rx="6" fill="#0b5cab"/>
  <text x="180" y="29" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Loan Comparison</text>

  <!-- Column headers -->
  <text x="48" y="56" font-size="9" font-weight="700" fill="#1f2937">Term</text>
  <text x="200" y="56" text-anchor="middle" font-size="9" font-weight="700" fill="#0b5cab">Option A</text>
  <text x="290" y="56" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Option B</text>
  <line x1="44" y1="62" x2="320" y2="62" stroke="#e5e7eb"/>

  <!-- Rows -->
  <g font-size="9" fill="#374151">
    <text x="48" y="80">Loan amount</text>
    <text x="240" y="80" text-anchor="end" fill="#111827" font-weight="600">$315,250</text>
    <text x="316" y="80" text-anchor="end" fill="#111827" font-weight="600">$315,250</text>

    <text x="48" y="96">Rate</text>
    <text x="240" y="96" text-anchor="end" fill="#111827" font-weight="600">6.490%</text>
    <text x="316" y="96" text-anchor="end" fill="#15803d" font-weight="700">5.990%</text>

    <text x="48" y="112">Discount points</text>
    <text x="240" y="112" text-anchor="end" fill="#111827" font-weight="600">0.000</text>
    <text x="316" y="112" text-anchor="end" fill="#111827" font-weight="600">1.250</text>

    <text x="48" y="128">Monthly P&amp;I</text>
    <text x="240" y="128" text-anchor="end" fill="#111827" font-weight="600">$1,990.52</text>
    <text x="316" y="128" text-anchor="end" fill="#15803d" font-weight="700">$1,886.87</text>

    <text x="48" y="144">Total PITI</text>
    <text x="240" y="144" text-anchor="end" fill="#111827" font-weight="600">$2,476.18</text>
    <text x="316" y="144" text-anchor="end" fill="#111827" font-weight="600">$2,372.53</text>

    <text x="48" y="160">Closing costs</text>
    <text x="240" y="160" text-anchor="end" fill="#111827" font-weight="600">$10,914</text>
    <text x="316" y="160" text-anchor="end" fill="#111827" font-weight="600">$14,855</text>
  </g>

  <line x1="44" y1="170" x2="320" y2="170" stroke="#e5e7eb"/>

  <!-- Savings callout -->
  <rect x="44" y="178" width="276" height="20" rx="4" fill="#dcfce7"/>
  <text x="182" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">Option B saves $103.65/mo • $37,314 over 30 yr</text>
</svg>

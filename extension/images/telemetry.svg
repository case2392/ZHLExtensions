<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Arial, sans-serif">
  <rect width="360" height="220" fill="#f4f6f9"/>

  <!-- Browser tab on left -->
  <rect x="14" y="20" width="120" height="80" rx="6" fill="#ffffff" stroke="#d9dee5"/>
  <rect x="14" y="20" width="120" height="16" rx="6" fill="#fafbfc"/>
  <text x="22" y="32" font-size="8" font-weight="700" fill="#1f2937">LOP tab</text>
  <g font-size="7" fill="#6b7280">
    <text x="22" y="50">VA calc opened</text>
    <text x="22" y="62">Bulk DL · 21 files</text>
    <text x="22" y="74">PE Workflow sent</text>
    <text x="22" y="86">Net Proceeds calc</text>
  </g>

  <!-- Arrow → SW -->
  <path d="M138 60 L172 60" stroke="#0b5cab" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0b5cab"/>
    </marker>
  </defs>

  <!-- Service worker -->
  <rect x="174" y="40" width="80" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="214" y="55" text-anchor="middle" font-size="9" font-weight="700" fill="#1e40af">Background</text>
  <text x="214" y="68" text-anchor="middle" font-size="8" fill="#1e3a8a">queue + flush 30s</text>

  <!-- Arrow → Apps Script -->
  <path d="M258 60 L294 60" stroke="#0b5cab" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>

  <!-- Apps Script icon -->
  <rect x="296" y="40" width="48" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="320" y="55" text-anchor="middle" font-size="8" font-weight="700" fill="#92400e">Apps</text>
  <text x="320" y="68" text-anchor="middle" font-size="8" font-weight="700" fill="#92400e">Script</text>

  <!-- Dashboard underneath -->
  <rect x="14" y="116" width="332" height="90" rx="8" fill="#ffffff" stroke="#d9dee5"/>
  <rect x="14" y="116" width="332" height="20" rx="8" fill="#0b5cab"/>
  <text x="180" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">ZHL Pack — Telemetry Dashboard</text>

  <!-- Three stat tiles -->
  <g font-size="8" fill="#374151">
    <rect x="26" y="146" width="100" height="50" rx="4" fill="#f0f7ff"/>
    <text x="76" y="160" text-anchor="middle" fill="#0b5cab" font-weight="700">Active LOs</text>
    <text x="76" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#0b5cab">150+</text>

    <rect x="130" y="146" width="100" height="50" rx="4" fill="#ecfdf5"/>
    <text x="180" y="160" text-anchor="middle" fill="#14532d" font-weight="700">Time saved</text>
    <text x="180" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">142d 3h</text>

    <rect x="234" y="146" width="100" height="50" rx="4" fill="#fef3c7"/>
    <text x="284" y="160" text-anchor="middle" fill="#78350f" font-weight="700">$ recouped</text>
    <text x="284" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">$256k</text>
  </g>

  <text x="180" y="208" text-anchor="middle" font-size="7" font-style="italic" fill="#6b7280">Anonymous — no borrower PII. Tool name + duration + email only.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Arial, sans-serif">
  <rect width="360" height="220" fill="#f3f3f3"/>

  <!-- Faux Lead page card with a tab strip -->
  <rect x="16" y="14" width="328" height="192" rx="6" fill="#ffffff" stroke="#dddbda"/>

  <!-- Tab strip -->
  <line x1="32" y1="50" x2="328" y2="50" stroke="#dddbda"/>

  <!-- Active Listening tab (greyed out — no longer the default) -->
  <text x="40" y="42" font-size="11" fill="#a8b3c0">Active Listening</text>

  <!-- Call Details tab (selected by extension) -->
  <text x="135" y="42" font-size="11" font-weight="700" fill="#0070d2">Call Details</text>
  <line x1="130" y1="50" x2="208" y2="50" stroke="#0070d2" stroke-width="3"/>

  <text x="222" y="42" font-size="11" fill="#a8b3c0">Alan Info</text>
  <text x="280" y="42" font-size="11" fill="#a8b3c0">Touring Info</text>

  <!-- Arrow indicating auto-switch -->
  <path d="M70 36 Q 100 18 165 36" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="3 3"/>
  <polygon points="161,32 170,36 162,42" fill="#10b981"/>
  <text x="98" y="22" text-anchor="middle" font-size="9" fill="#10b981" font-weight="700">auto-switch</text>

  <!-- Call Details fake content -->
  <g font-size="10" fill="#374151">
    <text x="32" y="80" font-weight="700" fill="#1f2937">Call Details</text>
    <text x="32" y="100">Last call disposition</text>
    <text x="328" y="100" text-anchor="end" fill="#111827" font-weight="600">Connected</text>
    <text x="32" y="118">Call type</text>
    <text x="328" y="118" text-anchor="end" fill="#111827" font-weight="600">Outbound</text>
    <text x="32" y="136">Talked to</text>
    <text x="328" y="136" text-anchor="end" fill="#111827" font-weight="600">Borrower</text>
  </g>

  <line x1="32" y1="150" x2="328" y2="150" stroke="#e8eaed"/>

  <text x="180" y="180" text-anchor="middle" font-size="11" fill="#92400e" font-weight="700">Skip "Active Listening", land on Call Details</text>
  <text x="180" y="194" text-anchor="middle" font-size="9" fill="#6b7280">runs once per Lead — switch back manually any time</text>
</svg>

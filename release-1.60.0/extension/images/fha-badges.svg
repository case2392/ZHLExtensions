<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Arial, sans-serif">
  <rect width="360" height="220" fill="#f4f6f9"/>

  <!-- Liabilities header bar with two badges -->
  <text x="14" y="32" font-size="13" font-weight="700" fill="#1f2937">Liabilities</text>

  <!-- Total Collections pill (green) -->
  <rect x="92" y="18" width="146" height="22" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="100" y="33" font-size="10" font-weight="700" fill="#16a34a">✓ Total Collections: $1,342</text>

  <!-- Total Disputed pill (green when under) -->
  <rect x="244" y="18" width="102" height="22" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="252" y="33" font-size="10" font-weight="700" fill="#16a34a">✓ Total Disputed: $0</text>

  <text x="14" y="58" font-size="9" fill="#6b7280">FHA caps: Collections $2,000 · Disputed $1,000</text>

  <!-- Liabilities table mock -->
  <rect x="14" y="68" width="332" height="138" rx="4" fill="#ffffff" stroke="#d1d5db"/>

  <!-- Header row -->
  <line x1="14" y1="86" x2="346" y2="86" stroke="#e5e7eb"/>
  <text x="22" y="81" font-size="8" font-weight="700" fill="#6b7280">Account type</text>
  <text x="160" y="81" font-size="8" font-weight="700" fill="#6b7280">Company / Payee</text>
  <text x="288" y="81" font-size="8" font-weight="700" fill="#6b7280">Balance</text>

  <!-- Counted (Unknown / Collection rows) -->
  <text x="22" y="100" font-size="9" fill="#0070d2">Unknown</text>
  <text x="160" y="100" font-size="9" fill="#1f2937">I.C. SYSTEM, INC</text>
  <text x="334" y="100" text-anchor="end" font-size="9" font-weight="700" fill="#1f2937">$782</text>

  <text x="22" y="114" font-size="9" fill="#0070d2">Unknown</text>
  <text x="160" y="114" font-size="9" fill="#1f2937">MIDLAND CREDIT MGMT</text>
  <text x="334" y="114" text-anchor="end" font-size="9" font-weight="700" fill="#1f2937">$363</text>

  <text x="22" y="128" font-size="9" fill="#0070d2">Unknown</text>
  <text x="160" y="128" font-size="9" fill="#1f2937">RECEIVABLE MGMT</text>
  <text x="334" y="128" text-anchor="end" font-size="9" font-weight="700" fill="#1f2937">$146</text>

  <text x="22" y="142" font-size="9" fill="#0070d2">Unknown</text>
  <text x="160" y="142" font-size="9" fill="#1f2937">TRANSWORLD SYS INC</text>
  <text x="334" y="142" text-anchor="end" font-size="9" font-weight="700" fill="#1f2937">$51</text>

  <!-- Not counted (regular accounts) -->
  <text x="22" y="160" font-size="9" fill="#6b7280">Revolving</text>
  <text x="160" y="160" font-size="9" fill="#6b7280">CAPITAL ONE BANK</text>
  <text x="334" y="160" text-anchor="end" font-size="9" fill="#6b7280">$970</text>

  <text x="22" y="174" font-size="9" fill="#6b7280">Installment</text>
  <text x="160" y="174" font-size="9" fill="#6b7280">GREATER IOWA CU (CO)</text>
  <text x="334" y="174" text-anchor="end" font-size="9" fill="#6b7280">$575</text>

  <!-- Sum line -->
  <line x1="14" y1="184" x2="346" y2="184" stroke="#e5e7eb"/>
  <text x="22" y="198" font-size="9" font-weight="700" fill="#16a34a">Counted toward FHA cap (collections only):</text>
  <text x="334" y="198" text-anchor="end" font-size="10" font-weight="700" fill="#16a34a">$1,342.00</text>
</svg>

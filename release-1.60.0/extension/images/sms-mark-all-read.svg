<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Arial, sans-serif">
  <rect width="360" height="220" fill="#f4f6f9"/>

  <!-- Salesforce SMS panel -->
  <rect x="14" y="14" width="332" height="192" rx="8" fill="#ffffff" stroke="#d9dee5"/>
  <rect x="14" y="14" width="332" height="26" rx="8" fill="#fafbfc"/>
  <text x="24" y="32" font-size="11" font-weight="700" fill="#1f2937">Messaging</text>
  <text x="280" y="32" font-size="10" fill="#0070d2" font-weight="600">Mark All Read</text>
  <rect x="265" y="20" width="76" height="14" rx="3" fill="none" stroke="#0070d2"/>

  <!-- Thread rows: unread badges getting cleared -->
  <g font-size="10" fill="#1f2937">
    <rect x="22" y="50" width="316" height="28" rx="4" fill="#f8fafc"/>
    <text x="32" y="68" font-weight="600">Sarah Malone</text>
    <text x="32" y="80" font-size="8" fill="#6b7280">Got the W-2, thanks!</text>
    <circle cx="324" cy="58" r="7" fill="#cbd5e1"/>
    <text x="324" y="62" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">✓</text>

    <rect x="22" y="86" width="316" height="28" rx="4" fill="#f8fafc"/>
    <text x="32" y="104" font-weight="600">Mark Hargett</text>
    <text x="32" y="116" font-size="8" fill="#6b7280">When can we close?</text>
    <circle cx="324" cy="94" r="7" fill="#cbd5e1"/>
    <text x="324" y="98" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">✓</text>

    <rect x="22" y="122" width="316" height="28" rx="4" fill="#f8fafc"/>
    <text x="32" y="140" font-weight="600">Ana Penaloza</text>
    <text x="32" y="152" font-size="8" fill="#6b7280">Sent the LE</text>
    <circle cx="324" cy="130" r="7" fill="#cbd5e1"/>
    <text x="324" y="134" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">✓</text>

    <rect x="22" y="158" width="316" height="28" rx="4" fill="#f8fafc"/>
    <text x="32" y="176" font-weight="600">Glenn Quinn</text>
    <text x="32" y="188" font-size="8" fill="#6b7280">Talk tomorrow</text>
    <circle cx="324" cy="166" r="7" fill="#cbd5e1"/>
    <text x="324" y="170" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">✓</text>
  </g>
</svg>

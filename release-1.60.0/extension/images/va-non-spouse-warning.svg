<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Arial, sans-serif">
  <rect width="360" height="220" fill="#f4f6f9"/>

  <!-- Sticky red banner at top -->
  <rect x="0" y="0" width="360" height="38" fill="#b91c1c"/>
  <rect x="0" y="38" width="360" height="3" fill="#7f1d1d"/>
  <text x="180" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">⚠ VA INELIGIBLE CO-BORROWER</text>
  <text x="180" y="32" text-anchor="middle" font-size="8" fill="#fee2e2">A non-veteran co-borrower must be the veteran's legally married spouse.</text>

  <!-- Borrower headers -->
  <text x="20" y="62" font-size="9" font-weight="700" fill="#0f172a">Richard Smith</text>
  <text x="78" y="62" font-size="8" fill="#5C5868">Primary borrower</text>
  <text x="195" y="62" font-size="9" font-weight="700" fill="#0f172a">Brittany Holloway</text>
  <text x="270" y="62" font-size="8" fill="#5C5868">Co-borrower</text>

  <!-- Primary: Veteran type (ok) -->
  <text x="20" y="84" font-size="8" font-weight="600" fill="#334155">Veteran type</text>
  <rect x="20" y="88" width="150" height="22" rx="4" fill="#fff" stroke="#d1d5db"/>
  <text x="28" y="103" font-size="9" fill="#0f172a">Regular military</text>

  <!-- Co-borrower: Veteran type (flagged) -->
  <text x="195" y="84" font-size="8" font-weight="600" fill="#334155">Veteran type</text>
  <rect x="195" y="88" width="150" height="22" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="203" y="103" font-size="9" fill="#7f1d1d">Non-military</text>

  <!-- Primary: Marital status (flagged) -->
  <text x="20" y="132" font-size="8" font-weight="600" fill="#334155">Marital status</text>
  <rect x="20" y="136" width="150" height="22" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="28" y="151" font-size="9" fill="#7f1d1d">Unmarried</text>

  <!-- Co-borrower: Marital status (flagged) -->
  <text x="195" y="132" font-size="8" font-weight="600" fill="#334155">Marital status</text>
  <rect x="195" y="136" width="150" height="22" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="203" y="151" font-size="9" fill="#7f1d1d">Unmarried</text>

  <!-- Caption -->
  <text x="20" y="184" font-size="8" fill="#5C5868">VA loan · veteran + non-veteran co-borrower · neither marked Married</text>
  <text x="20" y="198" font-size="8" fill="#b91c1c" font-weight="700">→ Fix veteran type, mark both Married, or remove the co-borrower</text>
</svg>
